# Founder Legal Guide: general legal information, not legal advice.
#
#   docker compose up -d postgres qdrant chroma   # databases only (local development)
#   docker compose up --build                     # everything

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: flg
      POSTGRES_PASSWORD: flg
      POSTGRES_DB: flg
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flg -d flg"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  chroma:
    image: chromadb/chroma:1.5.9
    ports: ["8001:8000"]
    volumes: [chroma-data:/data]

  backend:
    build: ./backend
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql://flg:flg@postgres:5432/flg
      QDRANT_URL: http://qdrant:6333
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CONFIG_DIR: /app/config
      DEMO_MODE: ${DEMO_MODE:-false}
      UPDATE_CRON: ${UPDATE_CRON:-0 3 * * *}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes: [./config:/app/config:ro]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      chroma: {condition: service_started}

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres-data:
  qdrant-data:
  chroma-data:
