[project]
name = "founder-legal-guide"
version = "0.1.0"
description = "Founder Legal Guide backend: legal guidance (not legal advice) for tech and AI founders"
authors = [
    { name = "r-roemisch", email = "rudolf.roemisch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.9",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.7.0",
    "langchain-openrouter>=0.2.9",
    "langchain-postgres>=0.0.19",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "mcp>=1.20",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
founder-legal-guide = "founder_legal_guide:main"
founder-legal-guide-ingest = "founder_legal_guide.ingestion.cli:main"
founder-legal-guide-update = "founder_legal_guide.ingestion.cli:update_main"
founder-legal-guide-golden = "founder_legal_guide.evaluation.cli:golden_main"
founder-legal-guide-eval = "founder_legal_guide.evaluation.cli:eval_main"
founder-legal-guide-mcp = "founder_legal_guide.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
