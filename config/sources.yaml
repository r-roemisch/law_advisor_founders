# Source Registry: every Source the Founder Legal Guide should hold, and where it comes from.
# Terms (Source, Source Tier, Legal Area, Jurisdiction, Legal Status, Pending Proposal) are defined in CONTEXT.md;
# the scope (Legal Areas, US coverage, Tier 3 policy) is in docs/SCOPE.md. The Coverage Map is config/coverage.yaml.
#
# Not legal advice. The Founder Legal Guide provides general legal information only. It does not replace
# consultation with a qualified lawyer.
#
# Scope decisions applied 2026-10-12. Identifiers were checked on 2026-10-12: CELEX numbers against the CELLAR SPARQL endpoint,
# gesetze-im-internet slugs against gii-toc.xml, eCFR parts against the eCFR structure API, Federal Register
# document numbers against the federalregister.gov API, and URLs by HTTP request. Anything not confirmed carries
# "UNVERIFIED: ..." in `notes`.
#
# How to add a Source
#   1. Pick an id: kebab-case, prefixed with its jurisdiction (eu-, de-, us-, us-ca-, us-de-, us-co-, us-tx-).
#   2. Set the tier:
#        1 = primary law (acts, codes, regulations, adopted implementing acts)
#        2 = official guidance from a regulator or authority that interprets a specific law
#            (EDPB guidelines, Commission guidelines, FTC rule FAQs, Copyright Office reports, NIST frameworks)
#        3 = curated practical how-to pages, public-sector or openly reusable only (ADR 0006): gruenderplattform.de,
#            existenzgruendungsportal.de, IHKs, Your Europe, SBA, FTC business blog, YC SAFE documents.
#            Honour robots.txt and TDM opt-outs at ingestion. Answers show short excerpts with a link.
#   3. Choose an adapter and its `ref` locator:
#        eurlex           {celex: "..."}                     latest consolidated text if one exists
#        gii              {slug: "...", sections: [...]}     gesetze-im-internet.de path segment; optional
#                                                            sections, e.g. ["305-310", "Art 246-246e"]
#        neuris           {eli: "..."}                       rechtsinformationen.bund.de (not used yet)
#        uscode           {title: N, sections: ["a-b", ...]}
#        ecfr             {title: N, part: N, sections: [...]}  sections optional
#        federal_register {document_number: "..."}
#        edpb | ec_digital | web_pinned   {url: "..."}      scraped and pinned
#   4. `update: auto` for structured adapters (eurlex, gii, neuris, uscode, ecfr, federal_register), where
#      changes are applied automatically. `update: review` for scraped pages, where a change creates a
#      "review needed" Change Record.
#   Optional: short_title, the citation name ("GDPR", or per language {en: GDPR, de: DSGVO}).
#   5. legal_status: pending_proposal | in_force | repealed. Put staged applicability in `applies_from`.
#   6. If the Source is required for a Legal Area x Jurisdiction cell, add its id to config/coverage.yaml.

