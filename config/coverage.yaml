# Coverage Map: for each in-scope Legal Area x Jurisdiction cell, the Sources (ids from config/sources.yaml)
# that must be in the Corpus for the cell to count as covered. See CONTEXT.md ("Coverage Map") and docs/SCOPE.md.
#
# Not legal advice. The Founder Legal Guide provides general legal information only. It does not replace
# consultation with a qualified lawyer.
#
# Scope decisions applied 2026-10-12.
#
# Conventions
#   - A cell lists only Sources of its own Jurisdiction. EU law also applies to German companies, but that is
#     covered by the EU cell. The answer layer combines EU + DE for a German Founder Profile.
#   - depth: deep     -> required set includes Tier 1, Tier 2 and at least one Tier 3 Source.
#     depth: standard -> core Tier 1 acts plus 1-2 practical (Tier 2 or 3) Sources.
#   - A Pending Proposal may be required (so the guide can say what is coming) but is never presented as law.
#
# Cells deliberately NOT in scope (docs/SCOPE.md, "US coverage"):
#   - contracts x US              US contract law is state common law and UCC; not listed in US coverage.
#                                 (ROSCA and the California Automatic Renewal Law sit under platform_law x US.)
#   - cybersecurity_product x US  Not listed in US coverage (e.g. state breach-notification laws, CA IoT law).
#   - employment x US                US employment law is out of scope (docs/SCOPE.md).
#   - "Other states" comprehensive privacy laws: summary table only, written by the project from the states'
#     official sources (NCSL dropped under ADR 0006). Not yet a Source; see docs/PLAN.md days 7-8.

