- id: fundraising-us-1
  question: We’re raising from US investors under Rule 506(b). Can we accept money from someone who isn’t an accredited
    investor?
  language: en
  kind: answerable
  legal_area: fundraising
  jurisdiction: US
  expected:
  - source_id: us-reg-d
    label: § 230.506 Exemption for limited offers and sales without regard to dollar amount of offering.
    anchor: s230.506
  expected_triggers: []
  expect_tax_referral: false
  reference_answer: Yes, but each non-accredited purchaser must be capable of evaluating the investment’s risks
    and merits, either alone or with a purchaser representative, or you must reasonably believe that immediately
    before the sale. Rule 506(b) also limits the number of purchasers counted under the rule to 35 in any 90-calendar-day
    period and requires compliance with its other conditions.
  status: draft
  notes: ''
- id: fundraising-us-2
  question: Our EU startup plans to use Regulation D for a US fundraise. Does that let us skip state securities
    rules and worry less about what our pitch says?
  language: en
  kind: answerable
  legal_area: fundraising
  jurisdiction: US
  expected:
  - source_id: us-reg-d
    label: § 230.500 Use of Regulation D.
    anchor: s230.500
  expected_triggers: []
  expect_tax_referral: false
  reference_answer: No. Regulation D does not remove the need to comply with applicable state laws on offering and
    selling securities. It also does not exempt the fundraise from federal antifraud or civil-liability rules, and
    you may need to provide additional material information so your disclosures are not misleading.
  status: draft
  notes: ''
- id: escalation-1
  question: We just received an Abmahnung from a competitor claiming our landing page infringes its trademark. It
    demands that we sign a cease-and-desist declaration by Friday. Can we ignore it if we change the page?
  language: en
  kind: escalation
  legal_area: escalation
  jurisdiction: any
  expected: []
  expected_triggers:
  - 1
  expect_tax_referral: false
  reference_answer: Talk to a lawyer promptly, especially before signing anything or letting the deadline pass.
    Changing the page may not resolve the claim, and a cease-and-desist declaration can create lasting obligations.
  status: draft
  notes: ''
- id: escalation-2
  question: Unser Startup hat entdeckt, dass eine falsch konfigurierte Datenbank möglicherweise Kundennamen und
    E-Mail-Adressen öffentlich zugänglich gemacht hat. Wir wissen noch nicht, ob jemand die Daten abgerufen hat
    – müssen wir das melden?
