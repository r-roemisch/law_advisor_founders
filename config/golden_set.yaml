  kind: escalation
  legal_area: escalation
  jurisdiction: any
  expected: []
  expected_triggers:
  - 3
  expect_tax_referral: false
  reference_answer: Sichert die Datenbank und dokumentiert sofort, was passiert ist und wann ihr es entdeckt habt.
    Sprecht umgehend mit einer auf Datenschutz spezialisierten Anwältin oder einem Anwalt, um Melde- und Benachrichtigungspflichten
