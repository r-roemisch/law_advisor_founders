# Models by role (see CONTEXT.md "Answer Model", ADR 0007).
#
# Not legal advice: the Founder Legal Guide provides general legal information only.
#
# Any OpenRouter model id works. Answer Models must support tool calling
# (https://openrouter.ai/models?supported_parameters=tools).
# Prices change often; the UI shows the actual cost reported by OpenRouter.

# Writes the Founder-facing answer. The first entry is the default; the UI offers all of them.
answer:
  - id: anthropic/claude-sonnet-5.5
    label: Claude Sonnet 5.5
  - id: openai/gpt-6-sol
    label: GPT-6 Sol
  - id: google/gemini-3.8-flash
    label: Gemini 3.8 Flash
  - id: mistralai/mistral-large-4-0
    label: Mistral Large 4 (EU provider)

# Supporting work: query translation, multi-query, reranking, question checks.
# (Claude Haiku was planned, but the account's OpenRouter guardrail blocks it; see ADR 0008.)
utility:
  id: openai/gpt-6-luna

# Scores evaluations. Keep it fixed across comparisons, or scores are not comparable.
judge:
  id: openai/gpt-6-sol
